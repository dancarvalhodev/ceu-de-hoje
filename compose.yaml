services:
    caddy:
        image: caddy:2.11.7-alpine
        depends_on:
            - php
        ports:
            - ${APP_PORT:-80}:80
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

    php:
        build:
            context: docker/php
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/etc/php/8.5/fpm/conf.d/99-ceu-de-hoje.ini:ro
            - ./docker/php/php.ini:/etc/php/8.5/cli/conf.d/99-ceu-de-hoje.ini:ro

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            # TCP, not the socket: during first-run init MySQL listens only on the socket
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:8.4-alpine
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - 8025:8025

    node:
        image: node:24-alpine
        profiles: [tools]
        user: ${HOST_UID:-1000}:${HOST_GID:-1000}
        environment:
            # Any uid may run here, so the npm cache cannot rely on a home directory
            npm_config_cache: /tmp/.npm
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - 5173:5173

volumes:
    mysql-data:
    redis-data:
